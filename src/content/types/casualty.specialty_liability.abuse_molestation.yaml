name: Sexual Abuse & Molestation Liability
parent: casualty.specialty_liability
alsoKnownAs: SAM liability; Sexual misconduct and molestation (SML)
description: Covers organizations against claims of sexual abuse by staff or volunteers, including claims of negligent hiring or supervision, which most CGL policies exclude.
example: A youth camp is sued for failing to supervise a counselor accused of abuse.
segment: Commercial
