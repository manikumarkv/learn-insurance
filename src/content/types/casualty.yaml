name: Casualty & Liability Insurance
alsoKnownAs: Liability insurance; Third-party coverage
description: Pays for injury or damage you cause to other people or their property, including legal defense costs.
example: A shop pays nothing out of pocket when a customer slips and sues, because its liability policy covers it.
segment: Both
usNotes: Liability rules (negligence, damages caps, joint and several liability) vary by state tort law.
