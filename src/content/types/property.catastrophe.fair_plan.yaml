name: FAIR Plans
parent: property.catastrophe
alsoKnownAs: Fair Access to Insurance Requirements Plan
description: State-created insurers of last resort for property owners who can't get cover in the regular market, often due to wildfire or urban risk.
example: A California homeowner dropped by their insurer gets fire cover from the California FAIR Plan.
segment: Both
usNotes: About 33 states plus DC have FAIR plans; usually named-peril cover that may need a separate 'difference in conditions' policy.
