name: Kidnap, Ransom & Extortion (K&R)
parent: specialty
alsoKnownAs: Special risks
description: Covers ransom payments, crisis consultants and related costs for kidnap, extortion and wrongful detention.
example: A company's engineer is kidnapped abroad and crisis experts are sent.
segment: Commercial
usNotes: Paying ransom to sanctioned persons is prohibited by OFAC.
