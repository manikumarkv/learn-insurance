name: Health Insurance
alsoKnownAs: Medical insurance; Health coverage
description: Pays for medical care, or pays cash, when you are ill, injured or disabled.
example: A family's plan pays most of the hospital bill when a child needs surgery.
segment: Both
usNotes: Private plans are regulated by states and by federal law (ACA, ERISA, HIPAA). Government programs are listed under Social & Government Programs.
