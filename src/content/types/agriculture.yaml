name: Agricultural & Crop Insurance
alsoKnownAs: Farm insurance; Ag insurance
description: Protects farmers and ranchers against crop losses, falling revenue, livestock deaths and farm property damage.
example: A corn farmer is paid when drought cuts the harvest in half.
segment: Commercial
usNotes: "Most US crop insurance is the Federal Crop Insurance Program: sold and serviced by private Approved Insurance Providers, with premiums subsidized and reinsured by USDA's Risk Management Agency (RMA) through the Federal Crop Insurance Corporation (FCIC)."
