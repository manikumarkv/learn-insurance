name: Energy Insurance
parent: commercial
alsoKnownAs: Oil and gas insurance; Energy package
description: Specialist property, liability and well-control cover for oil, gas and power businesses, onshore and offshore.
example: An offshore oil producer insures its platform, pipelines and the cost of regaining control of a well.
segment: Commercial
usNotes: Offshore facilities must show oil spill financial responsibility under OPA 90 (30 CFR Part 553), starting at $35 million; insurance is one accepted method.
