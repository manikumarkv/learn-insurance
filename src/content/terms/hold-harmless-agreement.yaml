term: Hold Harmless Agreement
contentStatus: basic
alsoKnownAs:
  - Indemnity Agreement
category: Legal/Latin
lines:
  - casualty
  - commercial
usageFrequency: Medium
difficulty: Intermediate
definition: A contract where one party agrees to protect the other from claims or losses.
example: A subcontractor agrees to hold the general contractor harmless for injuries on site.
