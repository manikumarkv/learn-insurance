name: Long-Term Care Partnership Policy
parent: health.ltc
alsoKnownAs: State Partnership plan
description: A qualifying LTC policy that lets you keep extra assets and still qualify for Medicaid if you use up your benefits.
example: A buyer protects $300,000 of assets by buying a Partnership policy with $300,000 of benefits.
segment: Personal
usNotes: Available in most states under the Deficit Reduction Act of 2005.
