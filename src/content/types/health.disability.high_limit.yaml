name: High-Limit Disability Insurance
parent: health.disability
alsoKnownAs: Excess disability; Jumbo disability
description: Disability cover for high earners whose income is above the most that standard disability insurers will cover.
example: A surgeon earning $1.5 million a year buys extra monthly disability benefits on top of her regular policy.
segment: Personal
usNotes: Usually written in the surplus lines market, most often at Lloyd's; California's surplus lines export list includes 'high limits disability' above admitted issue and participation limits.
