term: Gramm-Leach-Bliley Act
contentStatus: basic
abbreviation: GLBA
abbreviationIsCommonName: true
alsoKnownAs: []
category: Regulation
lines:
  - all
usageFrequency: Low
difficulty: Intermediate
definition: A 1999 federal law that, among other things, requires financial institutions including insurers to protect customer personal information and give privacy notices.
example: An insurer gives a privacy notice when you become a customer; since 2015 an annual notice is needed only if it changes its practices or shares data in ways that require an opt-out.
whereYoullSeeIt:
  - Regulatory filings
relatedTerms:
