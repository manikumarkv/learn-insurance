name: Maritime Piracy (Marine K&R)
parent: specialty.kr
alsoKnownAs: Piracy insurance; Marine kidnap and ransom
description: Covers ransom and related costs when a ship or its crew is seized by pirates.
example: Pirates hold a cargo ship off East Africa and the policy pays the ransom and crisis consultants.
segment: Commercial
usNotes: Paying ransom to sanctioned persons is prohibited by OFAC.
