name: Financial Guaranty Insurance
parent: financial
alsoKnownAs: Bond insurance; Municipal bond insurance
description: Guarantees timely payment of principal and interest on bonds if the issuer defaults.
example: A city's school bonds are insured so they earn a higher credit rating.
segment: Commercial
usNotes: Written by monoline insurers (e.g. Assured Guaranty, Build America Mutual); New York Insurance Law Article 69 restricts it to monolines.
