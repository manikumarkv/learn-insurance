name: Employment Practices Liability (EPLI)
parent: specialty.management_liability
alsoKnownAs: EPL
description: Covers claims from employees for wrongful termination, discrimination, harassment and retaliation.
example: An ex-employee sues for wrongful termination.
segment: Commercial
usNotes: Claims arise under Title VII, ADA, ADEA and state laws; EEOC charges are a common trigger. Wage-and-hour claims are usually excluded.
