name: State Disability & Paid Leave Programs
parent: social
alsoKnownAs: TDI; Paid family and medical leave (PFML)
description: State-run or state-mandated programs that pay partial wages for non-work illness, pregnancy or caring for family.
example: A new mother in California receives disability and paid family leave benefits.
segment: Personal
usNotes: Temporary disability programs exist in CA, HI, NJ, NY, RI and PR. Paid family and medical leave programs pay benefits in CA, NJ, NY, RI, WA, MA, CT, OR, CO, MN, DE, ME and DC; Maryland's benefits are delayed to 2028.
