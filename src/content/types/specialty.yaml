name: Specialty Insurance
alsoKnownAs: Specialty lines
description: Covers unusual, complex or modern risks that standard policies exclude. Many are written in the excess and surplus (E&S) market or at Lloyd's.
example: A tech firm buys cyber cover; a film studio insures a shoot.
segment: Both
usNotes: E&S (non-admitted) insurers can write risks admitted carriers decline; they aren't backed by state guaranty funds and buyers pay a surplus lines tax.
