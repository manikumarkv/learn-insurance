term: Reasonable Expectations Doctrine
contentStatus: basic
alsoKnownAs: []
category: Legal/Latin
lines:
  - all
usageFrequency: Low
difficulty: Advanced
definition: A rule in some courts that honors the coverage an ordinary policyholder would reasonably expect, even if the fine print says otherwise.
example: A court finds a policyholder reasonably expected water damage coverage.
whereYoullSeeIt: []
relatedTerms:
