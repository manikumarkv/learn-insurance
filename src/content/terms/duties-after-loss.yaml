term: Duties After Loss
contentStatus: basic
alsoKnownAs:
  - Duties in the Event of Loss
category: Policy Wording
lines:
  - all
usageFrequency: Medium
difficulty: Beginner
definition: Things you must do after a loss, like notifying the insurer, protecting property from more damage and providing records.
example: After a burst pipe you must stop the water and keep receipts.
