name: Survivorship Universal Life
parent: life.permanent.universal
alsoKnownAs: Second-to-die; Joint and last survivor
description: Covers two people (usually spouses) and pays out only after both have died.
example: A wealthy couple buys cover to pay estate taxes their heirs will owe after both die.
segment: Personal
usNotes: Often owned by an Irrevocable Life Insurance Trust (ILIT) to keep proceeds out of the taxable estate.
