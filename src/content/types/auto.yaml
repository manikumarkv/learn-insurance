name: Auto Insurance
alsoKnownAs: Car insurance; Motor vehicle insurance
description: Covers vehicles and drivers for damage to the vehicle, injuries, and harm caused to others. Some liability cover is legally required in nearly every state.
example: A driver's policy pays for another car's repairs after a rear-end collision.
segment: Both
usNotes: Minimum liability limits, no-fault rules and required coverages are set by each state. New Hampshire does not require auto insurance for most drivers but requires proof of financial responsibility after a crash.
