term: Insurance Data Security Model Law
contentStatus: basic
alsoKnownAs: []
category: Regulation
lines:
  - all
usageFrequency: Low
difficulty: Advanced
definition: An NAIC model law requiring insurers and agents to have information security programs and report cybersecurity events.
example: An insurer notifies the regulator of a data breach within 72 hours.
whereYoullSeeIt:
  - Regulatory filings
