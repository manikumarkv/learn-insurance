name: Life Insurance
alsoKnownAs: Life coverage
description: Pays money to chosen people (beneficiaries) when the insured person dies, and some types also build cash value you can use while alive.
example: A parent buys a policy so their family can pay off the mortgage and college costs if the parent dies.
segment: Personal
usNotes: Regulated by states; policy forms filed with each state insurance department. State guaranty associations protect policyholders if an insurer fails (typically at least $300,000 death benefit).
