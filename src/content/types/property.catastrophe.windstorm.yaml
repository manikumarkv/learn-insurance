name: Windstorm / Hurricane Coverage
parent: property.catastrophe
alsoKnownAs: Wind pool
description: Covers wind and hurricane damage. In some coastal areas wind is excluded from home policies and must be bought separately.
example: A Texas coastal homeowner buys wind cover from the state wind pool.
segment: Both
usNotes: State residual markets include Citizens Property Insurance (FL), TWIA (TX) and other coastal plans. Hurricane deductibles are often a percentage of the dwelling limit.
