name: Workers' Compensation & Employers' Liability
parent: casualty
alsoKnownAs: Workers' comp; WC/EL
description: Covers employees who are injured or become ill because of their work, paying medical bills and lost wages regardless of fault; in exchange, employees generally can't sue the employer.
example: A roofer who falls from a ladder receives medical care and weekly wage benefits.
segment: Commercial
usNotes: Required by state law in every state except Texas (where it is optional). Benefits and rules set by each state. Standard NCCI policy form.
