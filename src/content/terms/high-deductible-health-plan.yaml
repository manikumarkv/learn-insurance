usageFrequency: Medium
difficulty: Intermediate
definition: A plan with a higher deductible that meets IRS rules, allowing you to open an HSA.
example: A plan with a $3,300 deductible and HSA eligibility.
whereYoullSeeIt:
  - Policy document
relatedTerms:
