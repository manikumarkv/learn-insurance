name: Social & Government Programs
alsoKnownAs: Social insurance; Public programs
description: Insurance-like protection provided or required by federal and state governments, usually funded by payroll taxes or general taxes.
example: A retiree receives Social Security checks and uses Medicare for doctor visits.
segment: Personal
usNotes: Some programs are federal (Social Security, Medicare), some joint federal-state (Medicaid, CHIP, unemployment), and some purely state (state disability programs).
