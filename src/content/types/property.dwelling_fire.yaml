name: Dwelling Fire Policies (DP Forms)
parent: property
alsoKnownAs: Landlord policy; Dwelling property
description: Policies for homes that aren't owner-occupied, such as rentals or vacant homes, covering the building but not the tenant's belongings.
example: A landlord insures a rented house with a DP-3.
segment: Personal
usNotes: Liability is usually added by endorsement or a separate policy.
