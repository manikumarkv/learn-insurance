name: Commercial Lines (Business Property & Packages)
alsoKnownAs: Business insurance; Commercial P&C
description: Insurance businesses buy to protect their buildings, equipment, income and operations. Business liability, workers' comp and commercial auto are in their own branches.
example: A bakery buys cover for its ovens, premises and lost income after a fire.
segment: Commercial
usNotes: Most standard commercial forms come from ISO. Larger or unusual risks often go to the excess and surplus (E&S) lines market, which has lighter rate and form regulation.
