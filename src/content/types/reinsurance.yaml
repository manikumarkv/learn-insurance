name: Reinsurance
alsoKnownAs: Insurance for insurers
description: Insurance that insurance companies buy to pass part of their risk to another company (the reinsurer), protecting them from very large or many losses.
example: After a hurricane, a Florida home insurer recovers most of its claims from its reinsurers.
segment: Commercial
usNotes: US reinsurers are regulated by states; the NAIC Credit for Reinsurance Model Law governs when insurers can count reinsurance from non-US reinsurers on their balance sheets. June 1 is the key Florida renewal date.
