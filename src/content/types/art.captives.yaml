name: Captive Insurance
parent: art
alsoKnownAs: Captives
description: An insurance company owned by the business (or group of businesses) it insures, letting the owner control cover and costs.
example: A hospital system forms a captive to insure its medical malpractice.
segment: Commercial
usNotes: Leading US domiciles include Vermont, Utah, Delaware, North Carolina and Tennessee; Bermuda and Cayman are major offshore domiciles.
