term: Short-Rate Cancellation
contentStatus: basic
alsoKnownAs: []
category: Lifecycle
lines:
  - all
usageFrequency: Medium
difficulty: Intermediate
definition: A cancellation where the refund is less than the proportional amount to cover the insurer's costs.
example: Cancelling halfway through a $1,000 policy returns only $450.
whereYoullSeeIt:
  - Billing statement
relatedTerms:
  - pro-rata-cancellation
  - cancellation
usNotes: Some states prohibit or limit short-rate penalties in personal lines.
meta:
  source: editorial
