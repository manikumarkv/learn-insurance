name: Participating Whole Life
parent: life.permanent.whole
alsoKnownAs: Par whole life; Dividend-paying whole life
description: Whole life that may pay yearly dividends from the insurer's surplus, which can buy paid-up additions, reduce premiums or be taken as cash.
example: A policyholder uses dividends from a mutual insurer to buy paid-up additions.
segment: Personal
usNotes: Sold mainly by mutual insurers (e.g. Northwestern Mutual, MassMutual, New York Life). Dividends are not guaranteed.
