name: Term Life
parent: life
alsoKnownAs: Temporary life insurance
description: Covers you only for a fixed period, such as 10, 20 or 30 years, and pays out only if you die within that period. It has no cash value, which makes it the cheapest life cover.
example: A 30-year-old buys a 30-year term policy that matches the length of their mortgage.
segment: Personal
usNotes: One of the most widely bought individual life products and the cheapest per dollar of cover; whole life and indexed UL now bring in more new premium.
