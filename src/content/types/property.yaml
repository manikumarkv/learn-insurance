name: Home & Personal Property Insurance
alsoKnownAs: Home insurance; Homeowners and renters insurance
description: Pays to repair or replace homes and belongings that are damaged, destroyed or stolen. This branch covers personal (household) property; business property is under Commercial Lines.
example: A homeowner claims for repairs after a kitchen fire.
segment: Personal
usNotes: Regulated by states. Most standard forms come from ISO (Insurance Services Office); some insurers use their own or AAIS forms.
