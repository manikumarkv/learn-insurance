name: Scheduled Personal Property
parent: property
alsoKnownAs: Personal articles floater; Valuables coverage
description: Extra cover for high-value items like jewelry, art and collectibles, usually with no deductible and worldwide open-peril cover.
example: An engagement ring worth $15,000 is listed on a floater.
segment: Personal
usNotes: Standard homeowners policies have low sub-limits (e.g. $1,500) for theft of jewelry.
